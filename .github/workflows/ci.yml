name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q .
      - run: python -m pytest -q
      - run: node --check studio/static/studio.js
      - run: python scripts/export_synthbench_bundle.py
      - run: git diff --exit-code -- studio/data/synthbench_bundle.json
      - run: wu-speech-synthbench demo --multi-phrase-ratio 0.3 > /dev/null
